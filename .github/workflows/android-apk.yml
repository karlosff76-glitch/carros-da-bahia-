
name: Gerar APK - Carros da Bahia

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar ferramentas Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "build-tools;33.0.2" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Instalar templates Godot 4.3
        run: |
          apt-get update
          apt-get install -y curl unzip
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -fL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -o /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.3.stable/
      - name: Importar projeto
        run: godot --headless --editor --path . --quit

      - name: Gerar APK Android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Carros_da_Bahia.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Carros-da-Bahia-APK
          path: build/Carros_da_Bahia.apk
          
